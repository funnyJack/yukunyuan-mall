spring:
  application:
    name: mall-backend
  datasource:
    # 默认连本机 PostgreSQL；部署时用环境变量覆盖，不要把生产密码写进仓库
    url: "${DB_URL:jdbc:postgresql://localhost:5432/yukunyuan_mall}"
    driver-class-name: org.postgresql.Driver
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:s554517318}"
  jpa:
    hibernate:
      # 表结构由 Flyway 管理，这里只做校验，禁止 Hibernate 自动改表
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    # 不要向客户端泄露堆栈；业务错误由 ApiExceptionHandler 统一返回
    include-stacktrace: never

app:
  seed:
    # 首次启动写入 12 条演示商品，库里已有数据时不会重复写
    enabled: true

logging:
  level:
    com.yukunyuan.mall: INFO
